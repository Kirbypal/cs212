<!-- Developed by James: Semantic HTML5 layout -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
    </header>

    <main>
        <section id="dashboard">
            <h2>Total Expenses: $<span id="total-amount">0.00</span></h2>

            <!-- James: Spending Summary Cards UI (Weekly, Monthly, Yearly totals) -->
            <div id="summary-cards">
                <div class="summary-card">
                    <span class="summary-label">This Week</span>
                    <span class="summary-value" id="week-total">$0.00</span>
                </div>
                <div class="summary-card">
                    <span class="summary-label">This Month</span>
                    <span class="summary-value" id="month-total">$0.00</span>
                </div>
                <div class="summary-card">
                    <span class="summary-label">This Year</span>
                    <span class="summary-value" id="year-total">$0.00</span>
                </div>
            </div>
        </section>

        <section id="input-section">
            <!-- Brenden: Search Bar to filter expenses by keyword -->
            <input type="text" id="search-input" placeholder="Search expenses...">

            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Expense Name" required>
                <input type="number" id="expense-amount" placeholder="Amount" step="0.01" required>
                <select id="expense-category">
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <input type="date" id="expense-date" required>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section id="list-section">
            <h3>Recent Transactions</h3>

            <!-- Brenden: Category Filtering moved inside main layout -->
            <div id="filter-bar">
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <!-- James: Report Preview button -->
                <button id="open-report-btn" type="button">📊 Generate Report</button>
            </div>

            <ul id="expense-list"></ul>
            <!-- Brenden: Data Reset button - clears all logs from localStorage securely -->
            <button id="clear-all" style="margin-top: 10px; background-color: #ff4444; color: white; border: none; padding: 5px 10px; cursor: pointer;">Clear All Data</button>
        </section>
    </main>

    <!-- Don: Detailed Report View layout (printable table) -->
    <div id="report-modal" style="display:none;">
        <div id="report-modal-content">
            <h2>Expense Report</h2>
            <!-- James: Report Preview table - users review data before downloading -->
            <table id="report-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="report-body"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="3"><strong>Total</strong></td>
                        <td id="report-total"></td>
                    </tr>
                </tfoot>
            </table>
            <div id="report-actions">
                <!-- Don: Download CSV trigger button -->
                <button id="download-csv-btn" type="button">⬇ Download CSV</button>
                <!-- Don: Print to PDF using window.print() -->
                <button id="print-pdf-btn" type="button">🖨 Print to PDF</button>
                <button id="close-report-btn" type="button">✕ Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
